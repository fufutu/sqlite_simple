name: Android armeabi-v7a Build

# 触发规则：推送到master、打tag、PR到master时触发
on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 发布Release需要的权限
permissions:
  contents: write

jobs:
  Android_ARM32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # 只保留32位ARM这一个ABI
        abi: [armeabi-v7a]

    steps:
    # 拉取代码+子模块
    - uses: actions/checkout@v6
      with:
        submodules: true

    # 自动使用系统自带的最新Android NDK
    - name: Resolve Android NDK
      run: |
        if [ -z "${ANDROID_NDK_LATEST_HOME:-}" ]; then
          echo "Runner 未找到 Android NDK" >&2
          exit 1
        fi
        echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"

    # CMake配置：用NDK工具链编译32位ARM
    - name: Configure
      run: |
        cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-android-${{ matrix.abi }}" \
          -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI="${{ matrix.abi }}" \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/output-android-${{ matrix.abi }}" \
          -DBUILD_TEST_EXAMPLE=OFF \
          -DBUILD_SHELL=OFF

    # 执行编译
    - name: Build
      run: cmake --build "${{ github.workspace }}/build-android-${{ matrix.abi }}" --config Release --parallel

    # 安装输出到统一目录
    - name: Install
      run: cmake --install "${{ github.workspace }}/build-android-${{ matrix.abi }}" --config Release

    # 验证产物是否生成成功
    - name: Verify outputs
      run: |
        test -f "output-android-${{ matrix.abi }}/bin/libsimple.so"
        test -f "output-android-${{ matrix.abi }}/bin/dict/jieba.dict.utf8"

    # 打tag时自动打包成zip
    - name: Package
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir "libsimple-android-${{ matrix.abi }}"
        cp -r "output-android-${{ matrix.abi }}/bin/libsimple.so" \
              "output-android-${{ matrix.abi }}/bin/dict" \
              "libsimple-android-${{ matrix.abi }}/"
        zip -r "libsimple-android-${{ matrix.abi }}.zip" "libsimple-android-${{ matrix.abi }}"
      working-directory: "${{ github.workspace }}"

    # 打tag时自动上传到GitHub Release
    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: "${{ github.workspace }}/libsimple-android-${{ matrix.abi }}.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
